<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1020;
            color: white;
        }

        .container {
            width: 380px;
            padding: 35px;
            background: #151b2e;
            border: 1px solid #27365f;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(55, 100, 255, 0.2);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #64b5ff;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9aa7c7;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #d9e2ff;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #354570;
            border-radius: 9px;
            background: #0d1427;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #64b5ff;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #3478f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563d8;
        }

        .message {
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            background: #3a1f2b;
            color: #ff9aaa;
            text-align: center;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #9aa7c7;
            font-size: 14px;
        }

        .register a {
            color: #64b5ff;
            text-decoration: none;
        }

        .security {
            text-align: center;
            margin-top: 25px;
            color: #7f8ca8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🔐</div>

        <h1>Secure Login</h1>

        <p class="subtitle">
            Protected authentication system
        </p>

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">LOGIN</button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <div class="register">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

        <div class="security">
            🛡 Passwords are securely hashed
        </div>

    </div>

</body>
</html>
